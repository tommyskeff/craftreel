name: craftreel-example
version: 1.0
main: dev.tommyjs.craftreelexample.CraftReelExamplePlugin
api-version: 1.8
depend: [packetevents]
commands:
  reelrecord:
    description: Start/stop recording the 4x4 chunk area around you to a .reel file.
    usage: /reelrecord [name]
  reelplay:
    description: Join/leave a replay of a .reel file.
    usage: /reelplay [name]
  reellive:
    description: Start/stop recording yourself into a live replay with a fixed delay.
    usage: /reellive [delaySeconds]
  reelwatch:
    description: Join/leave a running live replay.
    usage: /reelwatch [player]
